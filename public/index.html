<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Feedback Engine</title>
    <meta name="description" content="A beautiful and secure portal for providing event feedback.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    <h1>Feedback Engine</h1>
                </div>
            </div>
        </header>
        
        <main>
            <div class="glass-card" id="form-selector-container">
                <h2>Select a Form</h2>
                <p>Choose an active feedback form to participate.</p>
                
                <div class="loading" id="forms-loading">Loading forms...</div>
                <div class="form-list" id="form-list"></div>
            </div>

            <div class="glass-card" id="dynamic-form-container" style="display: none;">
                <button class="back-button" id="btn-back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back to Forms
                </button>
                <h2 id="form-title">Form Title</h2>
                <p id="form-description">Form Description</p>

                <form id="feedback-form" enctype="multipart/form-data">
                    <div id="dynamic-fields"></div>
                    <button type="submit" class="primary-btn" id="submit-btn">Submit Feedback</button>
                </form>
                
                <div id="submission-message" class="message"></div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
